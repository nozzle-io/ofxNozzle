name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - name: Setup openFrameworks
        uses: nandenjin/openframeworks-action@v1
        with:
          command: setup-of
          of_version: "0.12.0"

      - uses: actions/checkout@v4
        with:
          path: addons/ofxNozzle
          submodules: recursive

      - name: Cache oF build
        uses: actions/cache@v4
        with:
          path: libs/openFrameworksCompiled
          key: of-0.12.0-macos-v4

      - name: Generate project
        uses: nandenjin/openframeworks-action@v1
        with:
          command: projectgenerator
          project_root: addons/ofxNozzle/testApp

      - name: Build
        uses: nandenjin/openframeworks-action@v1
        with:
          command: build
          project_root: addons/ofxNozzle/testApp

  build-windows:
    runs-on: windows-2022
    steps:
      - name: Setup openFrameworks
        uses: nandenjin/openframeworks-action@v1
        with:
          command: setup-of
          of_version: "0.12.0"

      - uses: actions/checkout@v4
        with:
          path: addons/ofxNozzle
          submodules: recursive

      - name: Cache oF build
        uses: actions/cache@v4
        with:
          path: libs/openFrameworksCompiled
          key: of-0.12.0-windows-v4

      - name: Generate project
        uses: nandenjin/openframeworks-action@v1
        with:
          command: projectgenerator
          project_root: addons/ofxNozzle/testApp

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build
        uses: nandenjin/openframeworks-action@v1
        with:
          command: build
          project_root: addons/ofxNozzle/testApp

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Setup openFrameworks
        uses: nandenjin/openframeworks-action@v1
        with:
          command: setup-of
          of_version: "0.12.0"

      - uses: actions/checkout@v4
        with:
          path: addons/ofxNozzle
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libunwind-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxmu-dev \
            libxxf86vm-dev libx11-dev x11proto-dev \
            libgl-dev libglew-dev freeglut3-dev libglu1-mesa-dev \
            libglfw3-dev \
            libcurl4-openssl-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-libav gstreamer1.0-pulseaudio \
            gstreamer1.0-alsa gstreamer1.0-x \
            libcairo2-dev libfreeimage-dev libfreetype6-dev libssl-dev \
            libpulse-dev libasound2-dev libmpg123-dev liburiparser-dev \
            libsndfile1-dev libopenal-dev \
            libassimp-dev libpugixml-dev \
            libdrm-dev libgbm-dev libegl-dev \
            libjack-jackd2-dev librtaudio-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev libxkbcommon-x11-dev \
            libraw1394-dev libudev-dev libusb-1.0-0-dev \
            cmake gdb

      - name: Cache oF build
        uses: actions/cache@v4
        with:
          path: libs/openFrameworksCompiled
          key: of-0.12.0-linux-v4

      - name: Build
        run: make -j$(nproc)
        working-directory: addons/ofxNozzle/testApp
