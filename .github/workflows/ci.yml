name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    uses: 2bbb/of-actions/.github/workflows/build-addon.yml@v2
    with:
      of_version: "0.12.0"
      addon_name: "ofxNozzle"
      test_app: "testApp"
      test_mode: "test"
      configs: '["Debug", "Release"]'
      preprocessor_defines: "NOZZLE_PLATFORM_WINDOWS=1;NOZZLE_HAS_D3D11=1;NOZZLE_HAS_OPENGL=1"

  gl-test:
    needs: test
    uses: 2bbb/of-actions/.github/workflows/build-addon.yml@v2
    with:
      of_version: "0.12.0"
      addon_name: "ofxNozzle"
      test_app: "gl_testApp"
      test_mode: "run"
      configs: '["Release"]'
      preprocessor_defines: "NOZZLE_PLATFORM_WINDOWS=1;NOZZLE_HAS_D3D11=1;NOZZLE_HAS_OPENGL=1"
