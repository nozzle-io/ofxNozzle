name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - name: Setup openFrameworks
        uses: nandenjin/openframeworks-action@v1
        with:
          command: setup-of
          of_version: "0.12.0"

      - uses: actions/checkout@v4
        with:
          path: addons/ofxNozzle
          submodules: recursive

      - name: Create test app
        run: |
          mkdir -p apps/devApps/ofxNozzleTest/src
          cat > apps/devApps/ofxNozzleTest/src/main.cpp << 'EOF'
          #include "ofMain.h"
          #include "ofApp.h"
          int main() {
            ofSetupOpenGL(100, 100, OF_WINDOW);
            ofRunApp(new ofApp());
          }
          EOF
          cat > apps/devApps/ofxNozzleTest/src/ofApp.h << 'EOF'
          #pragma once
          #include "ofMain.h"
          #include "ofxNozzle.h"
          class ofApp : public ofBaseApp {
          public:
            void setup() override;
            void draw() override;
          private:
            ofxNozzleSender sender;
            ofxNozzleReceiver receiver;
          };
          EOF
          cat > apps/devApps/ofxNozzleTest/src/ofApp.cpp << 'EOF'
          #include "ofApp.h"
          void ofApp::setup() {}
          void ofApp::draw() {}
          EOF
          echo "ofxNozzle" > apps/devApps/ofxNozzleTest/addons.make

      - name: Cache oF build
        uses: actions/cache@v4
        with:
          path: libs/openFrameworksCompiled
          key: of-0.12.0-macos-v3

      - name: Generate project
        uses: nandenjin/openframeworks-action@v1
        with:
          command: projectgenerator
          project_root: apps/devApps/ofxNozzleTest

      - name: Build
        uses: nandenjin/openframeworks-action@v1
        with:
          command: build
          project_root: apps/devApps/ofxNozzleTest

  build-windows:
    runs-on: windows-2022
    steps:
      - name: Setup openFrameworks
        uses: nandenjin/openframeworks-action@v1
        with:
          command: setup-of
          of_version: "0.12.0"

      - uses: actions/checkout@v4
        with:
          path: addons/ofxNozzle
          submodules: recursive

      - name: Create test app
        shell: bash
        run: |
          mkdir -p apps/devApps/ofxNozzleTest/src
          cat > apps/devApps/ofxNozzleTest/src/main.cpp << 'EOF'
          #include "ofMain.h"
          #include "ofApp.h"
          int main() {
            ofSetupOpenGL(100, 100, OF_WINDOW);
            ofRunApp(new ofApp());
          }
          EOF
          cat > apps/devApps/ofxNozzleTest/src/ofApp.h << 'EOF'
          #pragma once
          #include "ofMain.h"
          #include "ofxNozzle.h"
          class ofApp : public ofBaseApp {
          public:
            void setup() override;
            void draw() override;
          private:
            ofxNozzleSender sender;
            ofxNozzleReceiver receiver;
          };
          EOF
          cat > apps/devApps/ofxNozzleTest/src/ofApp.cpp << 'EOF'
          #include "ofApp.h"
          void ofApp::setup() {}
          void ofApp::draw() {}
          EOF
          echo "ofxNozzle" > apps/devApps/ofxNozzleTest/addons.make

      - name: Cache oF build
        uses: actions/cache@v4
        with:
          path: libs/openFrameworksCompiled
          key: of-0.12.0-windows-v3

      - name: Generate project
        uses: nandenjin/openframeworks-action@v1
        with:
          command: projectgenerator
          project_root: apps/devApps/ofxNozzleTest

      - name: Build
        uses: nandenjin/openframeworks-action@v1
        with:
          command: build
          project_root: apps/devApps/ofxNozzleTest

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Setup openFrameworks
        uses: nandenjin/openframeworks-action@v1
        with:
          command: setup-of
          of_version: "0.12.0"

      - uses: actions/checkout@v4
        with:
          path: addons/ofxNozzle
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libunwind-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxmu-dev \
            libxxf86vm-dev libx11-dev x11proto-dev \
            libgl-dev libglew-dev freeglut3-dev libglu1-mesa-dev \
            libglfw3-dev \
            libcurl4-openssl-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-libav gstreamer1.0-pulseaudio \
            gstreamer1.0-alsa gstreamer1.0-x \
            libcairo2-dev libfreeimage-dev libfreetype6-dev libssl-dev \
            libpulse-dev libasound2-dev libmpg123-dev liburiparser-dev \
            libsndfile1-dev libopenal-dev \
            libassimp-dev libpugixml-dev \
            libdrm-dev libgbm-dev libegl-dev \
            libjack-jackd2-dev librtaudio-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev libxkbcommon-x11-dev \
            libraw1394-dev libudev-dev libusb-1.0-0-dev \
            cmake gdb

      - name: Create test app
        run: |
          mkdir -p apps/devApps/ofxNozzleTest/src
          cat > apps/devApps/ofxNozzleTest/src/main.cpp << 'EOF'
          #include "ofMain.h"
          #include "ofApp.h"
          int main() {
            ofSetupOpenGL(100, 100, OF_WINDOW);
            ofRunApp(new ofApp());
          }
          EOF
          cat > apps/devApps/ofxNozzleTest/src/ofApp.h << 'EOF'
          #pragma once
          #include "ofMain.h"
          #include "ofxNozzle.h"
          class ofApp : public ofBaseApp {
          public:
            void setup() override;
            void draw() override;
          private:
            ofxNozzleSender sender;
            ofxNozzleReceiver receiver;
          };
          EOF
          cat > apps/devApps/ofxNozzleTest/src/ofApp.cpp << 'EOF'
          #include "ofApp.h"
          void ofApp::setup() {}
          void ofApp::draw() {}
          EOF
          echo "ofxNozzle" > apps/devApps/ofxNozzleTest/addons.make

      - name: Cache oF build
        uses: actions/cache@v4
        with:
          path: libs/openFrameworksCompiled
          key: of-0.12.0-linux-v3

      - name: Generate Makefile
        run: |
          cat > apps/devApps/ofxNozzleTest/Makefile << 'MAKEFILE'
          ifneq ($(wildcard config.make),)
          	include config.make
          endif
          ifndef OF_ROOT
          	OF_ROOT=../../..
          endif
          PROJECT_DEFINES = NOZZLE_HAS_DMA_BUF NOZZLE_HAS_OPENGL
          include $(OF_ROOT)/libs/openFrameworksCompiled/project/makefileCommon/compile.project.mk
          MAKEFILE

      - name: Build
        run: make -j$(nproc)
        working-directory: apps/devApps/ofxNozzleTest
