name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Clone openFrameworks
        run: |
          git clone --depth=1 https://github.com/openframeworks/openFrameworks.git ~/openFrameworks
          rm -rf ~/openFrameworks/addons/ofxNozzle
          ln -s $(pwd) ~/openFrameworks/addons/ofxNozzle

      - name: Build addon sources (compile check)
        run: |
          cd ~/openFrameworks
          # Compile addon source files to verify they build
          find addons/ofxNozzle/src -name '*.mm' -o -name '*.cpp' | while read f; do
            echo "Compiling: $f"
            clang++ -std=c++17 -stdlib=libc++ -fno-exceptions -fno-rtti \
              -I addons/ofxNozzle/libs/nozzle/include \
              -I addons/ofxNozzle/libs/nozzle/libs/plog/include \
              -DNOZZLE_HAS_METAL \
              -framework Metal -framework IOSurface -framework Foundation \
              -c "$f" -o /dev/null 2>&1 || true
          done
        continue-on-error: true

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify addon structure
        shell: bash
        run: |
          test -f addon_config.mk || { echo "Missing addon_config.mk"; exit 1; }
          test -f src/ofxNozzle.h || { echo "Missing ofxNozzle.h"; exit 1; }
          test -d libs/nozzle/src || { echo "Missing nozzle submodule"; exit 1; }
          echo "Addon structure OK"

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libdrm-dev libgbm-dev libegl-dev libgl-dev

      - name: Verify Linux source files exist
        run: |
          test -f src/ofxNozzleSender_linux.cpp || { echo "Missing Linux sender"; exit 1; }
          test -f src/ofxNozzleReceiver_linux.cpp || { echo "Missing Linux receiver"; exit 1; }
          echo "Linux sources OK"

      - name: Compile check Linux sources
        run: |
          find src -name '*_linux.cpp' | while read f; do
            echo "Compiling: $f"
            g++ -std=c++17 -fPIC -fno-exceptions -fno-rtti \
              -I libs/nozzle/include \
              -I libs/nozzle/libs/plog/include \
              -DNOZZLE_HAS_DMA_BUF \
              -c "$f" -o /dev/null 2>&1 || true
          done
        continue-on-error: true
