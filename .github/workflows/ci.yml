name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - name: Setup openFrameworks
        uses: nandenjin/openframeworks-action@v1
        with:
          command: setup-of
          of_version: "0.12.0"

      - uses: actions/checkout@v4
        with:
          path: openFrameworks/addons/ofxNozzle
          submodules: recursive

      - name: Compile addon sources
        run: |
          OF_INC=""
          for d in $(find libs -type d -name include 2>/dev/null); do
            OF_INC="$OF_INC -I $d"
            for sd in "$d"/*/; do
              [ -d "$sd" ] && OF_INC="$OF_INC -I ${sd%/}"
            done
          done

          FAIL=0
          for f in $(find openFrameworks/addons/ofxNozzle/src/platform/macos \( -name '*.mm' -o -name '*.cpp' \) 2>/dev/null); do
            echo "=== Compiling: $f ==="
            clang++ -std=c++17 -fPIC \
              -x objective-c++ -fobjc-arc \
              -framework Metal -framework IOSurface -framework Foundation -framework OpenGL \
              -I openFrameworks/addons/ofxNozzle/libs/nozzle/include \
              -I openFrameworks/addons/ofxNozzle/libs/nozzle/libs/plog/include \
              -I openFrameworks/addons/ofxNozzle/src \
              $OF_INC \
              -DNOZZLE_HAS_METAL \
              -c "$f" -o /dev/null || { echo "FAILED: $f"; FAIL=1; }
          done
          exit $FAIL

  build-windows:
    runs-on: windows-2022
    steps:
      - name: Setup openFrameworks
        uses: nandenjin/openframeworks-action@v1
        with:
          command: setup-of
          of_version: "0.12.0"

      - uses: actions/checkout@v4
        with:
          path: openFrameworks/addons/ofxNozzle
          submodules: recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Compile addon sources
        shell: bash
        run: |
          OF_INC=""
          for d in $(find libs -type d -name include 2>/dev/null); do
            OF_INC="$OF_INC -I $d"
            for sd in "$d"/*/; do
              [ -d "$sd" ] && OF_INC="$OF_INC -I ${sd%/}"
            done
          done

          FAIL=0
          for f in $(find openFrameworks/addons/ofxNozzle/src/platform/win -name '*.cpp' 2>/dev/null); do
            echo "=== Compiling: $f ==="
            clang++ -std=c++17 -c \
              -I openFrameworks/addons/ofxNozzle/libs/nozzle/include \
              -I openFrameworks/addons/ofxNozzle/libs/nozzle/libs/plog/include \
              -I openFrameworks/addons/ofxNozzle/src \
              $OF_INC \
              -DNOZZLE_HAS_D3D11 \
              "$f" -o NUL || { echo "FAILED: $f"; FAIL=1; }
          done
          exit $FAIL

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Setup openFrameworks
        uses: nandenjin/openframeworks-action@v1
        with:
          command: setup-of
          of_version: "0.12.0"

      - uses: actions/checkout@v4
        with:
          path: openFrameworks/addons/ofxNozzle
          submodules: recursive

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libdrm-dev libgbm-dev libegl-dev libgl-dev libglew-dev

      - name: Compile addon sources
        run: |
          OF_INC=""
          for d in $(find libs -type d -name include 2>/dev/null); do
            OF_INC="$OF_INC -I $d"
            for sd in "$d"/*/; do
              [ -d "$sd" ] && OF_INC="$OF_INC -I ${sd%/}"
            done
          done

          FAIL=0
          for f in $(find openFrameworks/addons/ofxNozzle/src/platform/linux -name '*.cpp' 2>/dev/null); do
            echo "=== Compiling: $f ==="
            g++ -std=c++17 -fPIC \
              -I openFrameworks/addons/ofxNozzle/libs/nozzle/include \
              -I openFrameworks/addons/ofxNozzle/libs/nozzle/libs/plog/include \
              -I openFrameworks/addons/ofxNozzle/src \
              $OF_INC \
              -DNOZZLE_HAS_DMA_BUF \
              -c "$f" -o /dev/null || { echo "FAILED: $f"; FAIL=1; }
          done
          exit $FAIL
