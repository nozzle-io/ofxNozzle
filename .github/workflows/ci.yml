name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - name: Download openFrameworks
        run: |
          curl -sL https://github.com/openframeworks/openFrameworks/releases/download/0.12.0/of_v0.12.0_osx_release.zip -o of.zip
          unzip -q of.zip
          mv of_v0.12.0_osx_release of_root

      - uses: actions/checkout@v4
        with:
          path: of_root/addons/ofxNozzle
          submodules: recursive

      - name: Cache oF build
        uses: actions/cache@v4
        with:
          path: of_root/libs/openFrameworksCompiled
          key: of-0.12.0-macos-v5

      - name: Build testApp
        run: make -j$(sysctl -n hw.ncpu)
        working-directory: of_root/addons/ofxNozzle/testApp

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Download openFrameworks
        run: |
          curl -sL https://github.com/openframeworks/openFrameworks/releases/download/0.12.0/of_v0.12.0_linux64gcc6_release.tar.gz -o of.tar.gz
          tar xzf of.tar.gz
          mv of_v0.12.0_linux64gcc6_release of_root

      - uses: actions/checkout@v4
        with:
          path: of_root/addons/ofxNozzle
          submodules: recursive

      - name: Install dependencies
        run: sudo ./of_root/scripts/linux/ubuntu/install_dependencies.sh -y

      - name: Cache oF build
        uses: actions/cache@v4
        with:
          path: of_root/libs/openFrameworksCompiled
          key: of-0.12.0-linux-v5

      - name: Build testApp
        run: make -j$(nproc)
        working-directory: of_root/addons/ofxNozzle/testApp

  build-windows:
    runs-on: windows-2022
    steps:
      - name: Download openFrameworks
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/openframeworks/openFrameworks/releases/download/0.12.0/of_v0.12.0_vs_release.zip" -OutFile "of.zip"
          Expand-Archive -Path "of.zip" -DestinationPath "."
          Rename-Item "of_v0.12.0_vs_release" "of_root"

      - uses: actions/checkout@v4
        with:
          path: of_root/addons/ofxNozzle
          submodules: recursive

      - name: Cache oF build
        uses: actions/cache@v4
        with:
          path: of_root/libs/openFrameworksCompiled
          key: of-0.12.0-windows-v5

      - name: Generate project
        shell: pwsh
        run: |
          $pg = "of_root\projectGenerator\resources\app\app\projectGenerator.exe"
          & $pg --ofPath="of_root" "of_root\addons\ofxNozzle\testApp"

      - name: Inject preprocessor defines
        shell: pwsh
        run: |
          $props = @'
          <Project>
            <ItemDefinitionGroup>
              <ClCompile>
                <PreprocessorDefinitions>NOZZLE_PLATFORM_WINDOWS=1;NOZZLE_HAS_D3D11=1;NOZZLE_HAS_OPENGL=1;%(PreprocessorDefinitions)</PreprocessorDefinitions>
              </ClCompile>
            </ItemDefinitionGroup>
          </Project>
          '@
          Set-Content -Path "of_root\addons\ofxNozzle\testApp\Directory.Build.props" -Value $props

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build
        shell: pwsh
        run: |
          msbuild "of_root\addons\ofxNozzle\testApp\testApp.vcxproj" /p:configuration=release /p:platform=x64 /maxCpuCount
