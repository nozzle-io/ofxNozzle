name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - name: Setup openFrameworks
        uses: nandenjin/openframeworks-action@v1
        with:
          command: setup-of
          of_version: "0.12.0"

      - uses: actions/checkout@v4
        with:
          path: addons/ofxNozzle
          submodules: recursive

      - name: Create test app
        run: |
          mkdir -p apps/devApps/ofxNozzleTest/src
          cat > apps/devApps/ofxNozzleTest/src/main.cpp << 'EOF'
          #include "ofMain.h"
          #include "ofApp.h"
          int main() {
            ofSetupOpenGL(100, 100, OF_WINDOW);
            ofRunApp(new ofApp());
          }
          EOF
          cat > apps/devApps/ofxNozzleTest/src/ofApp.h << 'EOF'
          #pragma once
          #include "ofMain.h"
          #include "ofxNozzle.h"
          class ofApp : public ofBaseApp {
          public:
            void setup() override;
            void draw() override;
          private:
            ofxNozzleSender sender;
            ofxNozzleReceiver receiver;
          };
          EOF
          cat > apps/devApps/ofxNozzleTest/src/ofApp.cpp << 'EOF'
          #include "ofApp.h"
          void ofApp::setup() {}
          void ofApp::draw() {}
          EOF
          echo "ofxNozzle" > apps/devApps/ofxNozzleTest/addons.make

      - name: Cache oF build
        uses: actions/cache@v4
        with:
          path: libs/openFrameworksCompiled
          key: of-0.12.0-macos-v1

      - name: Generate project
        uses: nandenjin/openframeworks-action@v1
        with:
          command: projectgenerator
          project_root: apps/devApps/ofxNozzleTest

      - name: Build
        uses: nandenjin/openframeworks-action@v1
        with:
          command: build
          project_root: apps/devApps/ofxNozzleTest

  build-windows:
    runs-on: windows-2022
    steps:
      - name: Setup openFrameworks
        uses: nandenjin/openframeworks-action@v1
        with:
          command: setup-of
          of_version: "0.12.0"

      - uses: actions/checkout@v4
        with:
          path: addons/ofxNozzle
          submodules: recursive

      - name: Create test app
        shell: bash
        run: |
          mkdir -p apps/devApps/ofxNozzleTest/src
          cat > apps/devApps/ofxNozzleTest/src/main.cpp << 'EOF'
          #include "ofMain.h"
          #include "ofApp.h"
          int main() {
            ofSetupOpenGL(100, 100, OF_WINDOW);
            ofRunApp(new ofApp());
          }
          EOF
          cat > apps/devApps/ofxNozzleTest/src/ofApp.h << 'EOF'
          #pragma once
          #include "ofMain.h"
          #include "ofxNozzle.h"
          class ofApp : public ofBaseApp {
          public:
            void setup() override;
            void draw() override;
          private:
            ofxNozzleSender sender;
            ofxNozzleReceiver receiver;
          };
          EOF
          cat > apps/devApps/ofxNozzleTest/src/ofApp.cpp << 'EOF'
          #include "ofApp.h"
          void ofApp::setup() {}
          void ofApp::draw() {}
          EOF
          echo "ofxNozzle" > apps/devApps/ofxNozzleTest/addons.make

      - name: Cache oF build
        uses: actions/cache@v4
        with:
          path: libs/openFrameworksCompiled
          key: of-0.12.0-windows-v1

      - name: Generate project
        uses: nandenjin/openframeworks-action@v1
        with:
          command: projectgenerator
          project_root: apps/devApps/ofxNozzleTest

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build
        uses: nandenjin/openframeworks-action@v1
        with:
          command: build
          project_root: apps/devApps/ofxNozzleTest

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Setup openFrameworks
        uses: nandenjin/openframeworks-action@v1
        with:
          command: setup-of
          of_version: "0.12.0"

      - uses: actions/checkout@v4
        with:
          path: addons/ofxNozzle
          submodules: recursive

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libdrm-dev libgbm-dev libegl-dev libgl-dev libglew-dev libcairo2-dev libfreeimage-dev libfreetype-dev libassimp-dev libpulse-dev libasound2-dev libglfw3-dev

      - name: Create test app
        run: |
          mkdir -p apps/devApps/ofxNozzleTest/src
          cat > apps/devApps/ofxNozzleTest/src/main.cpp << 'EOF'
          #include "ofMain.h"
          #include "ofApp.h"
          int main() {
            ofSetupOpenGL(100, 100, OF_WINDOW);
            ofRunApp(new ofApp());
          }
          EOF
          cat > apps/devApps/ofxNozzleTest/src/ofApp.h << 'EOF'
          #pragma once
          #include "ofMain.h"
          #include "ofxNozzle.h"
          class ofApp : public ofBaseApp {
          public:
            void setup() override;
            void draw() override;
          private:
            ofxNozzleSender sender;
            ofxNozzleReceiver receiver;
          };
          EOF
          cat > apps/devApps/ofxNozzleTest/src/ofApp.cpp << 'EOF'
          #include "ofApp.h"
          void ofApp::setup() {}
          void ofApp::draw() {}
          EOF
          echo "ofxNozzle" > apps/devApps/ofxNozzleTest/addons.make

      - name: Cache oF build
        uses: actions/cache@v4
        with:
          path: libs/openFrameworksCompiled
          key: of-0.12.0-linux-v1

      - name: Generate project
        uses: nandenjin/openframeworks-action@v1
        with:
          command: projectgenerator
          project_root: apps/devApps/ofxNozzleTest

      - name: Build
        uses: nandenjin/openframeworks-action@v1
        with:
          command: build
          project_root: apps/devApps/ofxNozzleTest
