name: CI

on:
  push:
    branches: [main, stable]
    tags: ['v*']
  pull_request:
    branches: [main, stable]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && github.event_name != 'release' }}

jobs:
  test:
    uses: 2bbb/of-actions/.github/workflows/build-addon.yml@main
    with:
      of_version: "0.12.1"
      addon_name: "ofxNozzle"
      test_app: "testApp"
      test_mode: "test"
      configs: '["Debug", "Release"]'
      cache_key_suffix: "v2"
      preprocessor_defines: "NOZZLE_PLATFORM_WINDOWS=1;NOZZLE_HAS_D3D11=1;NOZZLE_HAS_OPENGL=1"

  package:
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Prepare package metadata
        id: meta
        run: |
          repo="${{ github.event.repository.name }}"
          short_sha="${GITHUB_SHA::7}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            base="${repo}-${GITHUB_REF_NAME}"
          elif [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            base="${repo}-latest-${short_sha}"
          elif [[ "${GITHUB_REF}" == refs/heads/stable ]]; then
            base="${repo}-stable-${short_sha}"
          else
            base="${repo}-ci-${short_sha}"
          fi
          echo "package_root=${base}" >> "$GITHUB_OUTPUT"
          echo "package_name=${base}.zip" >> "$GITHUB_OUTPUT"

      - name: Assemble source addon package
        run: |
          root="dist/${{ steps.meta.outputs.package_root }}"
          mkdir -p "$root"
          cp README.md LICENSE addon_config.mk "$root/"
          cp -R src libs receiveExample sendExample testApp "$root/"
          find "$root" \( -name .git -o -name build -o -name .cache -o -name CMakeFiles \) -prune -exec rm -rf {} +
          find "$root" -name '*.o' -delete

      - name: Verify package contents
        run: |
          root="dist/${{ steps.meta.outputs.package_root }}"
          test -f "$root/README.md"
          test -f "$root/LICENSE"
          test -f "$root/addon_config.mk"
          test -f "$root/src/ofxNozzle.h"
          test -f "$root/libs/nozzle/include/nozzle/nozzle.hpp"

      - name: Create archive
        run: |
          cd dist
          zip -r "${{ steps.meta.outputs.package_name }}" "${{ steps.meta.outputs.package_root }}/"

      - name: Verify archive
        run: |
          archive="dist/${{ steps.meta.outputs.package_name }}"
          unzip -l "$archive" | grep -F '${{ steps.meta.outputs.package_root }}/addon_config.mk'
          unzip -l "$archive" | grep -F '${{ steps.meta.outputs.package_root }}/src/ofxNozzle.h'
          unzip -l "$archive" | grep -F '${{ steps.meta.outputs.package_root }}/libs/nozzle/include/nozzle/nozzle.hpp'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.package_root }}
          path: dist/${{ steps.meta.outputs.package_name }}

      - name: Check versioned release asset does not exist
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          asset="${{ steps.meta.outputs.package_name }}"
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name' > existing-assets.txt 2>/dev/null; then
            if grep -Fx "$asset" existing-assets.txt; then
              echo "versioned release asset already exists: $asset" >&2
              exit 1
            fi
          else
            echo "No existing release for ${GITHUB_REF_NAME}; upload may create it."
          fi

      - name: Upload latest development snapshot
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest development snapshot
          prerelease: true
          body: |
            Development snapshot from main.
            Commit: ${{ github.sha }}
          files: dist/${{ steps.meta.outputs.package_name }}

      - name: Upload versioned release
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ steps.meta.outputs.package_name }}

  # GL tests need GPU — run gl_testApp locally on real hardware
